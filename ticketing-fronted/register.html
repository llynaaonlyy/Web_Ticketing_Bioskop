<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">  
    <title>Register | Ticketing Bioskop</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body class="bg-light">

<div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="card shadow p-4" style="width: 100%; max-width: 400px;">
        
        <h3 class="text-center mb-4 judul">Register</h3>

        <form onsubmit="event.preventDefault(); register();">

            <div class="mb-3">
                <label class="form-label">Nama Lengkap</label>
                <input type="text" id="nama" class="form-control" placeholder="Masukkan nama lengkap">
            </div>

            <div class="mb-3">
                <label class="form-label">No HP</label>
                <input type="text" id="nohp" class="form-control" placeholder="Masukkan no hp">
            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="text" id="email" class="form-control" placeholder="Masukkan email">
            </div>

            <div class="mb-3">
                <label class="form-label">Sandi</label>
                <div class="input-group">
                    <input type="password" id="password" class="form-control" placeholder="Masukkan sandi">
                    <span class="input-group-text" onclick="togglePassword('password', this)" style="cursor:pointer">
                        <i class="bi bi-eye-slash"></i>
                    </span>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Konfirmasi Sandi</label>
                <div class="input-group">
                    <input type="password" id="confirmPassword" class="form-control" placeholder="Masukkan ulang sandi">
                    <span class="input-group-text" onclick="togglePassword('confirmPassword', this)" style="cursor:pointer"></span>
                </div>
            </div>

            <button id="btnRegister" type="submit" class="btn-login">
                <span class="btn-text">Registrasi</span>
                <span class="spinner"></span>
            </button>

        </form>

        <div class="text-center mt-3">
            <p class="mb-0">
                Sudah Punya Akun?
                <a href="index.html" class="text-decoration-none">Login</a>
            </p>
        </div>

    </div>
</div>

<script>
    function togglePassword(inputId, el) {
    const input = document.getElementById(inputId);
    const icon = el.querySelector("i");

    if (input.type === "password") {
        input.type = "text";
        icon.classList.remove("bi-eye-slash");
        icon.classList.add("bi-eye");
    } else {
        input.type = "password";
        icon.classList.remove("bi-eye");
        icon.classList.add("bi-eye-slash");
    }
}

    async function register() {
    const nama = document.getElementById("nama").value.trim();
    const nohp = document.getElementById("nohp").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    const btn = document.getElementById("btnRegister");
    const spinner = btn.querySelector(".spinner");
    const text = btn.querySelector(".btn-text");

    if (nama.length < 3) return alert("Nama minimal 3 karakter");
    if (!email.includes("@")) return alert("Email tidak valid");
    if (nohp.replace(/\D/g, "").length < 10) return alert("No HP tidak valid");
    if (password.length < 6) return alert("Password minimal 6 karakter");
    if (password !== confirmPassword) return alert("Password tidak cocok");

    btn.disabled = true;
    spinner.style.display = "inline-block";
    text.innerText = "Memproses...";

    try {
        const response = await fetch("http://localhost:5000/api/auth/register", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                nama,
                email,
                noHp: nohp,
                password,
                confirmPassword
            })
        });

        const data = await response.json();

        if (data.success) {
            alert("Registrasi berhasil, silakan login");
            window.location.href = "index.html";
        } else {
            alert(data.message || "Registrasi gagal");
        }

    } catch (err) {
        alert("Gagal terhubung ke server");
        console.error(err);
    } finally {
        btn.disabled = false;
        spinner.style.display = "none";
        text.innerText = "Registrasi";
    }
}
</script>

</body>
</html>
