<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Pilih Kursi | Ticketing Bioskop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

<div class="container py-5 text-center">
    <h2 class="mb-2">Pilih Kursi</h2>
    <h5 id="judulFilm" class="text-muted mb-4"></h5>

    <div class="screen mb-4">
    LAYAR BIOSKOP
    </div>

    <div class="seat-container mb-4">
        <script>
            const rows = ['A','B','C','D','E','F'];
            rows.forEach(row => {
                document.write(`<div class="seat-row aisle">`);
                for (let i = 1; i <= 8; i++) {
                    document.write(
                        `<div class="seat" data-seat="${row}${i}">${row}${i}</div>`
                    );
                }
                document.write(`</div>`);
            });
        </script>
    </div>

    <h5>Kursi dipilih: <span id="selectedSeats">-</span></h5>
    <h5>Total Harga: <span id="totalPrice">Rp 0</span></h5>

    <div class="btn-mobile-wrap">
        <a href="dashboard.html" class="btn btn-warning mt-3">Kembali</a>
        <button class="btn btn-warning-biru mt-3" onclick="lanjut()">Lanjut Booking</button>
    </div>
    
</div>

<script>
    const filmData = {
    avatar: { judul: "Avatar: Fire and Ash", harga: 45000 },
    zootopia: { judul: "Zootopia 2", harga: 40000 },
    agak: { judul: "Agak Laen: Menyala Pantiku!", harga: 45000 },
    jurassic: { judul: "Jurassic World Rebirth", harga: 45000 },
    nia: { judul: "NIA", harga: 45000 },
    hari: { judul: "Sebelum 7 Hari", harga: 45000 },
    kmg: { judul: "Komang", harga: 45000 },
};

    function lanjut() {
    localStorage.setItem("halamanKursi", window.location.href);

    window.location.href = "pembayaran.html";
    }

</script>

<script src="script.js"></script>
</body>
</html>
