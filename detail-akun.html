<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Detail Akun | Cinema's</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="stylee.css">
</head>
<body>

<div class="about-header">
    <a href="profil.html" class="btn-back">
      <i class="bi bi-arrow-left"></i>
    </a>
    <h4 class="header-title">Detail Akun</h4>
</div>

<div class="about-brand">
    <h2 class="brand-title-detail">Cinema's</h2>
</div>

<!-- CONTENT -->
<div class="container detail-container">

  <!-- TITLE -->
  <h4 class="fw-bold mb-1">Profil</h4>
  <p class="text-muted mb-4">
    Detail profil dan pengaturan di halaman ini akan digunakan di semua website
    <span class="fw-semibold">Cinema's</span>.
  </p>

  <div class="card">
    <div class="card-body">
      <h6 class="fw-bold mb-3">Info Pemilik Akun</h6>

      <div class="info-item d-flex justify-content-between align-items-center">
        <div>
          <small class="text-muted">Nama</small>
          <p class="mb-0 fw-semibold" id="namaUser">-</p>
        </div>
        <i class="bi bi-pencil"></i>
      </div>

      <div class="info-item d-flex justify-content-between align-items-center">
        <div>
          <small class="text-muted">No. Telepon</small>
          <p class="mb-0 fw-semibold" id="phoneUser">-</p>
        </div>
        <i class="bi bi-pencil"></i>
      </div>

      <div class="info-item d-flex justify-content-between align-items-center">
        <div>
          <small class="text-muted">Email</small>
          <p class="mb-0 fw-semibold" id="emailUser">-</p>
        </div>
        <i class="bi bi-pencil"></i>
      </div>

      <div class="info-item d-flex justify-content-between align-items-center">
        <div>
          <small class="text-muted">Password</small>
          <p class="mb-0 fw-semibold" id="passwordUser">••••••••</p>
        </div>
        <i class="bi bi-pencil"></i>
      </div>

    </div>
  </div>
</div>

<script>
  const user = JSON.parse(localStorage.getItem("user"));

  if (!user) {
    // kalau belum login / data kosong
    window.location.href = "index.html";
  }

  // ISI DATA KE HALAMAN
  document.getElementById("namaUser").innerText =
    user.nama || "-";

  document.getElementById("phoneUser").innerText =
    user.phone || "-";

  document.getElementById("emailUser").innerText =
    user.email || "-";

  // password sengaja disamarkan
  if (user.password) {
    document.getElementById("passwordUser").innerText =
      "•".repeat(user.password.length);
  }
</script>

</body>
</html>
