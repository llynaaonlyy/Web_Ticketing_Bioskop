<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Pembayaran</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs/qrcode.min.js"></script>
</head>
<body class="bg-light">
<div class="container py-5">

  <h2 class="text-center mb-4">Pembayaran</h2>

  <div class="card mb-4">
    <div class="card-body">
      <p><b>Film:</b> <span id="film" class="text-film"></span></p>
      <p><b>Kursi:</b> <span id="kursi" class="text-seat"></span></p>
      <p><b>Total:</b> Rp <span id="total" class="text-total"></span></p>
    </div>
  </div>

  <div class="d-flex justify-content-between gap-3 mt-4 payment-btn-wrap">
    <select class="form-select mb-4 metode-select" id="metode" onchange="pilihMetode()">
      <option value="">-- Pilih Metode Pembayaran --</option>
      <option value="bank">Transfer Bank</option>
      <option value="ewallet">E-Wallet</option>
      <option value="qris">QRIS</option>
      <option value="cod">Bayar di Tempat</option>
    </select>

    <div class="metode-wrapper">
      <div id="bank" class="metode-box d-none">
        <p>Transfer ke:</p>
        <ul>
          <li>BCA: 1234567890 a.n Cinemas's</li>
          <li>BRI: 9876543210 a.n Cinemas's</li>
        </ul>
        <input type="file" class="form-control mb-3">
      </div>

      <div id="ewallet" class="metode-box d-none">
        <p class="metode-title">DANA / ShopeePay / GoPay</p>
        <p class="metode-number">085876918325 a.n Cinemas's</p>
        <input type="file" class="form-control mb-3">
      </div>

      <div id="qris" class="metode-box d-none text-center">
        <div id="qrcode" class="my-3"></div>
        <input type="file" class="form-control mb-3">
      </div>

      <div id="cod" class="metode-box d-none">
        <div class="alert alert-warning">
          Silakan bayar di kasir. <b>Mohon siapkan uang pas.</b>
        </div>
      </div>
    </div>
  </div>

    <div class="d-flex justify-content-between gap-3 mt-4">
        <button class="btn btn-back w-50" onclick="kembali()">Kembali</button>
        <button class="btn btn-confirm w-50" onclick="konfirmasi()">Konfirmasi Pembayaran</button>
    </div>

</div>

<script>
document.addEventListener("DOMContentLoaded", function () {

  const film = localStorage.getItem("filmJudul");
  const seats = JSON.parse(localStorage.getItem("seats"));
  const total = localStorage.getItem("total");

  if (!film || !seats || !total) {
    alert("Data pembayaran tidak ditemukan!");
    window.location.href = "dashboard.html";
    return;
  }

  document.getElementById("film").textContent = film;
  document.getElementById("kursi").textContent = seats.join(", ");
  document.getElementById("total").textContent = total;

});

  function pilihMetode() {
    ["bank","ewallet","qris","cod"].forEach(id=>{
      document.getElementById(id).classList.add("d-none");
    });

    const metode = document.getElementById("metode").value;
    if (!metode) return;

    document.getElementById(metode).classList.remove("d-none");

    if (metode === "qris") {
      document.getElementById("qrcode").innerHTML = "";
      new QRCode(document.getElementById("qrcode"), {
        text: "Haloo, ini hanya untuk penilaian yaa ;)",
        width: 180,
        height: 180
      });
    }
  }

  function konfirmasi() {
    localStorage.setItem("status", "LUNAS");
    window.location.href = "tiket.html";
  }

    function kembali() {
    const halaman = localStorage.getItem("halamanKursi");

    if (halaman) {
        window.location.href = halaman;
    } else {
        window.location.href = "dashboard.html"; 
    }
    }
</script>

</body>
</html>
