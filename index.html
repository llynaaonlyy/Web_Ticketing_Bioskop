<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">  
    <title>Login | Ticketing Bioskop</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="card shadow p-4" style="width: 100%; max-width: 400px;">
        
        <h3 class="text-center mb-4 judul">Login</h3>
        
        <form onsubmit="event.preventDefault(); login();">

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="text" id="loginInput" class="form-control"
                    placeholder="Masukkan email">
            </div>

            <div class="mb-3">
                <label class="form-label">Sandi</label>
                <div class="input-group">
                    <input type="password" id="password" class="form-control"
                        placeholder="Masukkan sandi">
                    <span class="input-group-text" onclick="togglePassword()" style="cursor:pointer">
                        <i class="bi bi-eye-slash" id="eyeIcon"></i>
                    </span>
                </div>
            </div>

            <div class="text-start mb-3">
                <a href="file:///D:/projek_ticketing/ticketing-backend/frontend-forgot-password.html" class="text-decoration-none">
                    Lupa sandi?
                </a>
            </div>

            <button id="btnLogin" type="submit" class="btn-login">
                <span class="btn-text">Login</span>
                <span class="spinner"></span>
            </button>

        </form>

        <div class="text-center mt-3">
            <p class="mb-0">
                Belum Punya Akun?
                <a href="register.html" class="text-decoration-none">Registrasi</a>
            </p>
        </div>

    </div>
</div>

<script>
function togglePassword() {
    const pass = document.getElementById("password");
    const eye = document.getElementById("eyeIcon");

    if (pass.type === "password") {
        pass.type = "text";
        eye.classList.remove("bi-eye-slash");
        eye.classList.add("bi-eye");
    } else {
        pass.type = "password";
        eye.classList.remove("bi-eye");
        eye.classList.add("bi-eye-slash");
    }
}

async function login() {
    const loginInput = document.getElementById("loginInput").value.trim();
    const password = document.getElementById("password").value;
    const btn = document.getElementById("btnLogin");
    const spinner = btn.querySelector(".spinner");
    const text = btn.querySelector(".btn-text");

    if (!loginInput) return alert("Email atau No HP wajib diisi");
    if (!password) return alert("Password wajib diisi");

    btn.disabled = true;
    spinner.style.display = "inline-block";
    text.innerText = "Memproses...";

    try {
        const response = await fetch("http://localhost:5000/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email: loginInput, password: password })
        });

        const data = await response.json();

        if (data.success) {
        if (data.token) {
            localStorage.setItem("token", data.token);
        }

        // TAMBAHAN PENTING
        localStorage.setItem("user", JSON.stringify({
            nama: data.user?.nama || "User",
            ticketCount: data.user?.ticketCount || 0,
            filmCount: data.user?.filmCount || 0,
            genreHistory: data.user?.genreHistory || []
        }));

        window.location.href = "dashboard.html";
        } else {
            alert(data.message || "Login gagal");
        }

    } catch (err) {
        alert("Gagal terhubung ke server");
        console.error(err);
    } finally {
        btn.disabled = false;
        spinner.style.display = "none";
        text.innerText = "Login";
    }
}
</script>

</body>
</html>
